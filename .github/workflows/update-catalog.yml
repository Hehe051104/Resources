name: Update Course Catalog

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'catalog.json'
      - 'web/**'
  workflow_dispatch: # 允许在 GitHub Actions 页面手动触发测试

permissions:
  contents: write # 必须开启写入权限，否则 Actions 无法自动提交 catalog.json

jobs:
  generate-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run catalog generator
        run: python scripts/generate_catalog.py

      - name: Commit and push catalog.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add catalog.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update catalog.json [skip ci]" && git push)