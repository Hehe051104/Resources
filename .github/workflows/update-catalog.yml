name: Auto Update Course Catalog

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'catalog.json'
      - 'web/**'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: update-catalog-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate catalog.json
        run: python scripts/generate_catalog.py

      - name: Commit and push catalog.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          if git diff --staged --quiet; then
            echo "No changes to catalog.json"
            exit 0
          fi
          git commit -m "chore(catalog): auto update course index [skip ci]"
          git pull --rebase origin main
          git push