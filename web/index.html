  <script>
    let catalogData = null;
    let currentPath = [];
    let currentFilter = 'all';
    let searchQuery = '';
    let selectedPaths = new Set();

    // 上传模块状态
    let selectedFileObj = null;
    let dirLevelsState = []; // 每级目录的选择状态: { mode: 'existing' | 'new', value: string }
    let turnstileWidgetId = null;
    let turnstileToken = "";

    document.getElementById('siteTitle').textContent = CONFIG.SITE_TITLE;
    document.title = CONFIG.SITE_TITLE;

    function getRawUrl(filePath) {
      const encodedPath = filePath.split('/').map(encodeURIComponent).join('/');
      if (CONFIG.DOWNLOAD_PROXY_PREFIX) {
        const prefix = CONFIG.DOWNLOAD_PROXY_PREFIX.replace(/\/$/, '');
        const fullPrefix = prefix.startsWith('http') ? prefix : `${window.location.origin}${prefix}`;
        return `${fullPrefix}/${encodedPath}`;
      }
      return `https://raw.githubusercontent.com/${CONFIG.GITHUB_USER}/${CONFIG.GITHUB_REPO}/${CONFIG.BRANCH}/${encodedPath}`;
    }

    async function loadVisitorStats() {
      const ns = `suda-${CONFIG.GITHUB_USER}-${CONFIG.GITHUB_REPO}`.toLowerCase().replace(/[^a-z0-9-]/g, '-');
      const apiBase = 'https://abacus.jasoncameron.dev';
      const todayStr = new Date(Date.now() + 8 * 3600 * 1000).toISOString().slice(0, 10);
      const isNewVisitor = !localStorage.getItem('suda_repo_visited_v2');

      try {
        const [totalPvRes, todayPvRes] = await Promise.all([
          fetch(`${apiBase}/hit/${ns}/total-pv`),
          fetch(`${apiBase}/hit/${ns}/pv-${todayStr}`)
        ]);

        if (totalPvRes.ok) {
          const d = await totalPvRes.json();
          if (typeof d.value === 'number') document.getElementById('statTotalPv').textContent = d.value.toLocaleString();
        }
        if (todayPvRes.ok) {
          const d = await todayPvRes.json();
          if (typeof d.value === 'number') document.getElementById('statTodayPv').textContent = d.value.toLocaleString();
        }

        let uvRes = await fetch(`${apiBase}/${isNewVisitor ? 'hit' : 'get'}/${ns}/total-uv`);
        if (uvRes.status === 404) uvRes = await fetch(`${apiBase}/hit/${ns}/total-uv`);
        if (uvRes.ok) {
          const d = await uvRes.json();
          if (typeof d.value === 'number') {
            document.getElementById('statTotalUv').textContent = d.value.toLocaleString();
            localStorage.setItem('suda_repo_visited_v2', '1');
          }
        }
      } catch (e) {
        console.warn('访问统计跳过:', e);
      }
    }

    async function init() {
      loadVisitorStats();
      try {
        const res = await fetch('./catalog.json?t=' + Date.now());
        if (!res.ok) throw new Error('无法读取 catalog.json');
        catalogData = await res.json();
        document.getElementById('statsText').textContent =
          `共收录 ${catalogData.total_files} 份资料 · 更新于 ${catalogData.updated_at.replace(' UTC', '')}`;
        render();
      } catch (err) {
        document.getElementById('listContainer').innerHTML =
          `<div class="p-10 text-center text-red-500 text-sm">目录加载失败：${err.message}</div>`;
      }
    }

    function getCurrentNode() {
      let node = catalogData.tree;
      for (const segment of currentPath) {
        const next = (node.dirs || []).find(d => d.name === segment);
        if (!next) { currentPath = []; return catalogData.tree; }
        node = next;
      }
      return node;
    }

    function navigateTo(pathArr) {
      currentPath = pathArr;
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      clearSelection();
      render();
    }

    function matchFilter(ext) {
      if (currentFilter === 'all') return true;
      if (currentFilter === 'ppt') return ['ppt', 'pptx'].includes(ext);
      if (currentFilter === 'pdf') return ext === 'pdf';
      if (currentFilter === 'doc') return ['doc', 'docx', 'md', 'txt'].includes(ext);
      if (currentFilter === 'zip') return ['zip', 'rar', '7z', 'tar', 'gz'].includes(ext);
      return true;
    }

    function getFileIcon(ext) {
      if (['ppt', 'pptx'].includes(ext)) return '📊';
      if (ext === 'pdf') return '📕';
      if (['doc', 'docx'].includes(ext)) return '📘';
      if (['xls', 'xlsx', 'csv'].includes(ext)) return '📗';
      if (['zip', 'rar', '7z'].includes(ext)) return '📦';
      if (['png', 'jpg', 'jpeg', 'gif', 'webp'].includes(ext)) return '🖼️';
      if (['py', 'c', 'cpp', 'java', 'js', 'html', 'md', 'ipynb'].includes(ext)) return '💻';
      return '📄';
    }

    function canPreview(ext) {
      return ['pdf', 'doc', 'docx', 'png', 'jpg', 'jpeg', 'gif', 'webp', 'md', 'txt'].includes(ext);
    }

    function render() {
      if (!catalogData) return;

      const bc = document.getElementById('breadcrumb');
      let bcHtml = `<button onclick="navigateTo([])" class="hover:text-blue-600 font-medium flex items-center gap-1 transition">🏠 全部资料</button>`;
      currentPath.forEach((seg, idx) => {
        const target = JSON.stringify(currentPath.slice(0, idx + 1)).replace(/"/g, '&quot;');
        bcHtml += `<span class="text-slate-300 mx-0.5">/</span><button onclick="navigateTo(${target})" class="hover:text-blue-600 transition ${idx === currentPath.length - 1 ? 'text-slate-900 font-semibold' : ''}">${seg}</button>`;
      });
      bc.innerHTML = bcHtml;

      const container = document.getElementById('listContainer');
      let dirsToShow = [];
      let filesToShow = [];

      if (searchQuery.trim()) {
        const kw = searchQuery.trim().toLowerCase();
        filesToShow = catalogData.files.filter(f =>
          f.path.toLowerCase().includes(kw) && matchFilter(f.ext)
        );
      } else {
        const node = getCurrentNode();
        dirsToShow = currentFilter === 'all' ? (node.dirs || []) : [];
        filesToShow = (node.files || []).filter(f => matchFilter(f.ext));
      }

      if (dirsToShow.length === 0 && filesToShow.length === 0) {
        container.innerHTML = `<div class="p-12 text-center text-slate-400 text-sm">当前目录下没有符合条件的资料</div>`;
        return;
      }

      let html = '';

      dirsToShow.forEach(dir => {
        const nextPath = JSON.stringify([...currentPath, dir.name]).replace(/"/g, '&quot;');
        html += `
          <div onclick="navigateTo(${nextPath})" class="grid grid-cols-12 gap-2 px-4 py-3 hover:bg-white/65 cursor-pointer transition items-center group">
            <div class="col-span-9 sm:col-span-8 flex items-center gap-2.5 min-w-0">
              <span class="w-4"></span>
              <span class="text-lg group-hover:scale-110 transition">📁</span>
              <span class="font-medium text-sm text-slate-800 truncate group-hover:text-blue-600 transition">${dir.name}</span>
              <span class="text-[11px] px-2 py-0.5 bg-white/80 border border-slate-200/60 text-slate-500 rounded-full shrink-0">${dir.total_files}</span>
            </div>
            <div class="col-span-2 text-right text-xs text-slate-400 hidden sm:block">文件夹</div>
            <div class="col-span-3 sm:col-span-2 text-right text-xs text-blue-600 font-medium opacity-80 group-hover:opacity-100">打开 →</div>
          </div>`;
      });

      filesToShow.forEach(file => {
        const checked = selectedPaths.has(file.path) ? 'checked' : '';
        const url = getRawUrl(file.path);
        const safePath = file.path.replace(/'/g, "\\'");
        const safeName = file.name.replace(/'/g, "\\'");
        const subPathHtml = searchQuery.trim()
          ? `<div class="text-[11px] text-slate-400 truncate mt-0.5">📍 ${file.parts.slice(0, -1).join(' / ') || '根目录'}</div>`
          : '';

        html += `
          <div class="grid grid-cols-12 gap-2 px-4 py-2.5 hover:bg-white/60 transition items-center">
            <div class="col-span-7 sm:col-span-8 flex items-center gap-2.5 min-w-0">
              <input type="checkbox" ${checked} onchange="toggleFileSelect('${safePath}', this.checked)" class="file-checkbox rounded border-slate-300 text-blue-600 shrink-0" data-path="${file.path}" />
              <span class="text-lg shrink-0">${getFileIcon(file.ext)}</span>
              <div class="min-w-0 flex-1">
                <div class="text-sm text-slate-800 truncate" title="${file.name}">${file.name}</div>
                ${subPathHtml}
              </div>
            </div>
            <div class="col-span-2 text-right text-xs text-slate-500 hidden sm:block">${file.size_str}</div>
            <div class="col-span-5 sm:col-span-2 flex items-center justify-end gap-1.5">
              ${canPreview(file.ext) ? `<button onclick="openPreview('${safePath}', '${safeName}', '${file.ext}')" class="px-2.5 py-1 text-xs bg-white/80 hover:bg-white border border-slate-200/70 text-slate-700 rounded-full transition shadow-2xs">预览</button>` : ''}
              <a href="${url}" download="${file.name}" target="_blank" class="px-3 py-1 text-xs bg-blue-500/10 hover:bg-blue-600 text-blue-600 hover:text-white rounded-full font-medium transition">下载</a>
            </div>
          </div>`;
      });

      container.innerHTML = html;
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      document.getElementById('clearSearchBtn').classList.toggle('hidden', !searchQuery);
      render();
    });

    function clearSearch() {
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      render();
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.className = 'filter-btn px-3 py-1 rounded-full hover:bg-white/60 text-slate-600 transition';
        });
        btn.className = 'filter-btn px-3 py-1 rounded-full bg-white text-blue-600 font-medium shadow-sm transition';
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    function toggleFileSelect(path, isChecked) {
      if (isChecked) selectedPaths.add(path);
      else selectedPaths.delete(path);
      updateBatchBar();
    }

    function toggleSelectAll(isChecked) {
      document.querySelectorAll('.file-checkbox').forEach(cb => {
        cb.checked = isChecked;
        if (isChecked) selectedPaths.add(cb.dataset.path);
        else selectedPaths.delete(cb.dataset.path);
      });
      updateBatchBar();
    }

    function clearSelection() {
      selectedPaths.clear();
      const allCb = document.getElementById('selectAllCheckbox');
      if (allCb) allCb.checked = false;
      updateBatchBar();
      render();
    }

    function updateBatchBar() {
      const bar = document.getElementById('batchBar');
      document.getElementById('selectedCount').textContent = selectedPaths.size;
      bar.classList.toggle('hidden', selectedPaths.size === 0);
    }

    async function downloadSelectedAsZip() {
      if (selectedPaths.size === 0) return;
      const btn = document.getElementById('zipDownloadBtn');
      const originText = btn.textContent;
      btn.disabled = true;

      try {
        const zip = new JSZip();
        let done = 0;
        for (const filePath of selectedPaths) {
          btn.textContent = `打包中 (${++done}/${selectedPaths.size})...`;
          const res = await fetch(getRawUrl(filePath));
          if (!res.ok) throw new Error(`下载失败: ${filePath}`);
          const blob = await res.blob();
          zip.file(filePath, blob);
        }
        btn.textContent = '生成压缩包...';
        const content = await zip.generateAsync({ type: 'blob' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = `苏大课程资料打包_${new Date().toISOString().slice(0,10)}.zip`;
        link.click();
      } catch (e) {
        alert('打包过程中出错：' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = originText;
      }
    }

    async function openPreview(filePath, fileName, ext) {
      const modal = document.getElementById('previewModal');
      const body = document.getElementById('previewBody');
      const dlBtn = document.getElementById('previewDownloadBtn');
      const url = getRawUrl(filePath);

      document.getElementById('previewTitle').textContent = fileName;
      dlBtn.href = url;
      dlBtn.download = fileName;
      body.innerHTML = '<div class="text-sm text-slate-500">正在加载预览内容...</div>';
      modal.classList.remove('hidden');

      if (['png', 'jpg', 'jpeg', 'gif', 'webp'].includes(ext)) {
        body.innerHTML = `<img src="${url}" class="max-h-full max-w-full object-contain rounded-xl shadow" />`;
      } else if (ext === 'pdf') {
        body.innerHTML = `<iframe src="${url}?inline=1" class="w-full h-full border-0 rounded-2xl bg-white"></iframe>`;
      } else if (['doc', 'docx'].includes(ext)) {
        const officeViewerUrl = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(url)}`;
        body.innerHTML = `
          <div class="w-full text-center text-[11px] text-slate-500 pb-1.5">
            正在通过 Office Online 渲染文档，若加载较慢可点击右上角「下载原文件」查看
          </div>
          <iframe src="${officeViewerUrl}" class="w-full flex-1 border-0 rounded-2xl bg-white"></iframe>`;
      } else {
        try {
          const res = await fetch(url);
          const text = await res.text();
          body.innerHTML = `<pre class="w-full h-full bg-white/90 p-5 rounded-2xl text-xs font-mono overflow-auto whitespace-pre-wrap text-slate-800">${text.replace(/</g, '&lt;')}</pre>`;
        } catch (e) {
          body.innerHTML = `<div class="text-sm text-red-500">文本加载失败，请直接点击右上角下载查看。</div>`;
        }
      }
    }

    function closePreview() {
      document.getElementById('previewModal').classList.add('hidden');
      document.getElementById('previewBody').innerHTML = '';
    }

    // ================= 投稿上传弹窗与逐级目录选择器逻辑 =================
    function openUploadModal() {
      if (!catalogData) {
        alert('目录数据尚未加载完成，请稍后再试');
        return;
      }
      document.getElementById('uploadModal').classList.remove('hidden');
      document.getElementById('uploadFeedback').classList.add('hidden');

      // 如果用户当前正浏览某个课程文件夹，默认帮他自动定位到该目录
      dirLevelsState = currentPath.length > 0
        ? currentPath.map(name => ({ mode: 'existing', value: name }))
        : [{ mode: 'existing', value: '' }];

      renderDirSelectors();
      updateFinalPathPreview();

      // 渲染 Turnstile 验证码
      if (window.turnstile && CONFIG.TURNSTILE_SITE_KEY && !CONFIG.TURNSTILE_SITE_KEY.includes('请替换')) {
        if (turnstileWidgetId === null) {
          turnstileWidgetId = turnstile.render('#turnstileWidget', {
            sitekey: CONFIG.TURNSTILE_SITE_KEY,
            callback: (token) => { turnstileToken = token; },
            'expired-callback': () => { turnstileToken = ""; }
          });
        } else {
          turnstile.reset(turnstileWidgetId);
          turnstileToken = "";
        }
      }
    }

    function closeUploadModal() {
      document.getElementById('uploadModal').classList.add('hidden');
    }

    // 渲染多级目录联动下拉框 + 新建子文件夹输入框
    function renderDirSelectors() {
      const container = document.getElementById('dirSelectorContainer');
      container.innerHTML = '';

      let currentTreeNode = catalogData.tree;
      let canWalkTree = true;

      for (let i = 0; i < dirLevelsState.length; i++) {
        const state = dirLevelsState[i];
        const availableDirs = (canWalkTree && currentTreeNode && currentTreeNode.dirs) ? currentTreeNode.dirs : [];

        const row = document.createElement('div');
        row.className = 'flex items-center gap-2';

        const badge = document.createElement('span');
        badge.className = 'text-[11px] font-medium text-slate-400 w-12 shrink-0';
        badge.textContent = `第 ${i + 1} 级`;
        row.appendChild(badge);

        if (availableDirs.length > 0) {
          const select = document.createElement('select');
          select.className = 'flex-1 px-3 py-1.5 text-xs bg-white border border-slate-200 rounded-xl outline-none focus:border-blue-500';

          const defaultOpt = document.createElement('option');
          defaultOpt.value = '';
          defaultOpt.textContent = i === 0 ? '-- 请选择所属课程 / 专题 --' : '-- 存放在上一级目录（不进入子目录）--';
          select.appendChild(defaultOpt);

          availableDirs.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.name;
            opt.textContent = `📁 ${d.name}`;
            if (state.mode === 'existing' && state.value === d.name) opt.selected = true;
            select.appendChild(opt);
          });

          const newOpt = document.createElement('option');
          newOpt.value = '__NEW__';
          newOpt.textContent = i === 0 ? '➕ 新建顶级课程文件夹...' : '➕ 在此新建子文件夹...';
          if (state.mode === 'new') newOpt.selected = true;
          select.appendChild(newOpt);

          select.onchange = (e) => {
            const val = e.target.value;
            // 截断后面的层级状态
            dirLevelsState = dirLevelsState.slice(0, i + 1);
            if (val === '__NEW__') {
              dirLevelsState[i] = { mode: 'new', value: '' };
            } else if (val === '') {
              dirLevelsState[i] = { mode: 'existing', value: '' };
            } else {
              dirLevelsState[i] = { mode: 'existing', value: val };
              const matched = availableDirs.find(d => d.name === val);
              if (matched && matched.dirs && matched.dirs.length > 0) {
                dirLevelsState.push({ mode: 'existing', value: '' });
              }
            }
            renderDirSelectors();
            updateFinalPathPreview();
          };
          row.appendChild(select);
        }

        // 如果当前级处于新建模式，或者当前目录下已经没有预设子目录了，显示新建目录输入框
        if (state.mode === 'new' || availableDirs.length === 0) {
          const input = document.createElement('input');
          input.type = 'text';
          input.value = state.value;
          input.placeholder = i === 0 ? '输入新课程全称（如：大学物理）' : '输入新子文件夹名称（如：历年试卷）';
          input.className = 'flex-1 px-3 py-1.5 text-xs bg-white border border-blue-300 rounded-xl outline-none focus:border-blue-500';
          input.oninput = (e) => {
            dirLevelsState[i].mode = 'new';
            dirLevelsState[i].value = e.target.value;
            updateFinalPathPreview();
          };
          row.appendChild(input);
        }

        // 如果第 1 级已经选好了且总层级小于 5 级，允许用户主动追加下一级子文件夹
        if (i === dirLevelsState.length - 1 && state.value.trim() !== '' && dirLevelsState.length < 5) {
          const addSubBtn = document.createElement('button');
          addSubBtn.type = 'button';
          addSubBtn.title = '继续在下面新建下一级子文件夹';
          addSubBtn.className = 'px-2.5 py-1.5 text-[11px] bg-blue-50 hover:bg-blue-100 text-blue-600 rounded-xl shrink-0 font-medium transition';
          addSubBtn.textContent = '+ 子目录';
          addSubBtn.onclick = () => {
            dirLevelsState.push({ mode: 'new', value: '' });
            renderDirSelectors();
          };
          row.appendChild(addSubBtn);
        }

        container.appendChild(row);

        // 推进目录树节点指针
        if (canWalkTree && state.mode === 'existing' && state.value) {
          const nextNode = availableDirs.find(d => d.name === state.value);
          if (nextNode) currentTreeNode = nextNode;
          else canWalkTree = false;
        } else {
          canWalkTree = false;
        }
      }
    }

    function getSelectedDirParts() {
      return dirLevelsState.map(s => s.value.trim()).filter(Boolean);
    }

    function updateFinalPathPreview() {
      const dirParts = getSelectedDirParts();
      const fileName = document.getElementById('customFileNameInput').value.trim();
      const previewEl = document.getElementById('finalPathPreview');

      if (dirParts.length === 0 || !fileName) {
        previewEl.textContent = '请先选择（或输入）至少一级文件夹并选择文件';
        return;
      }
      previewEl.textContent = `${dirParts.join(' / ')} / ${fileName}`;
    }

    function handleFilePicked(file) {
      if (!file) return;
      if (file.size > 20 * 1024 * 1024) {
        alert('文件体积超过 20 MB 上限，请压缩后再上传！');
        return;
      }
      selectedFileObj = file;
      document.getElementById('pickedFileText').textContent = `已选择：${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
      document.getElementById('customFileNameInput').value = file.name;
      updateFinalPathPreview();
    }

    // 支持拖拽文件到上传框
    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-blue-500', 'bg-blue-50'); });
    dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('border-blue-500', 'bg-blue-50'); });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-blue-500', 'bg-blue-50');
      if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        handleFilePicked(e.dataTransfer.files[0]);
      }
    });

    async function submitUpload() {
      const feedback = document.getElementById('uploadFeedback');
      const btn = document.getElementById('submitUploadBtn');
      const dirParts = getSelectedDirParts();
      const customName = document.getElementById('customFileNameInput').value.trim();

      const showMsg = (msg, isError = true) => {
        feedback.className = `rounded-2xl p-3 text-xs leading-relaxed ${isError ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`;
        feedback.innerHTML = msg;
        feedback.classList.remove('hidden');
      };

      if (dirParts.length === 0) return showMsg('请至少选择或输入一级课程目录！');
      if (!selectedFileObj || !customName) return showMsg('请先选择要上传的资料文件！');
      if (!turnstileToken) return showMsg('请先完成上方的人机验证！');

      const targetPath = `${dirParts.join('/')}/${customName}`;
      const formData = new FormData();
      formData.append('file', selectedFileObj);
      formData.append('targetPath', targetPath);
      formData.append('contributor', document.getElementById('contributorInput').value.trim() || '匿名苏大同学');
      formData.append('remark', document.getElementById('remarkInput').value.trim());
      formData.append('cfToken', turnstileToken);

      btn.disabled = true;
      btn.textContent = '正在上传并生成审核请求...';
      feedback.classList.add('hidden');

      try {
        const res = await fetch(CONFIG.UPLOAD_WORKER_URL, {
          method: 'POST',
          body: formData
        });
        const result = await res.json();

        if (!res.ok || !result.success) {
          throw new Error(result.error || '上传失败，请稍后重试');
        }

        showMsg(
          `🎉 <strong>投稿成功！</strong><br>资料已自动提交至仓库审核队列（PR #${result.prNumber}），管理员点击合并后全站即可看到！<br><a href="${result.prUrl}" target="_blank" class="underline font-medium mt-1 inline-block">点击查看提交记录 →</a>`,
          false
        );
        selectedFileObj = null;
        document.getElementById('pickedFileText').textContent = '点击选择文件，或将文件拖拽至此处';
        document.getElementById('customFileNameInput').value = '';
        updateFinalPathPreview();
      } catch (err) {
        showMsg(`❌ ${err.message}`);
      } finally {
        btn.disabled = false;
        btn.textContent = '确认提交资料';
        if (window.turnstile && turnstileWidgetId !== null) {
          turnstile.reset(turnstileWidgetId);
          turnstileToken = "";
        }
      }
    }

    init();
  </script>
</body>
</html>
