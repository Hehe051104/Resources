<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>苏州大学课程资料共享库</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 45%, #e0f2fe 100%);
      background-attachment: fixed;
    }

    /* Apple 风格磨砂玻璃面板 */
    .apple-glass {
      background: rgba(255, 255, 255, 0.68);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow: 0 8px 32px rgba(15, 23, 42, 0.045), inset 0 1px 0 rgba(255, 255, 255, 0.85);
    }

    .apple-glass-header {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 4px 24px rgba(15, 23, 42, 0.03);
    }

    .apple-glass-card {
      background: rgba(255, 255, 255, 0.62);
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.035), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .apple-glass-card:hover {
      background: rgba(255, 255, 255, 0.78);
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(15, 23, 42, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.95);
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.45); border-radius: 999px; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col relative overflow-x-hidden">

  <!-- 背景弥散光晕（衬托毛玻璃通透感） -->
  <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute -top-24 -left-20 w-96 h-96 rounded-full bg-blue-300/25 blur-3xl"></div>
    <div class="absolute top-1/3 -right-24 w-[28rem] h-[28rem] rounded-full bg-indigo-300/20 blur-3xl"></div>
    <div class="absolute -bottom-24 left-1/3 w-96 h-96 rounded-full bg-sky-200/30 blur-3xl"></div>
  </div>

  <script>
    // ================= 1. 基础配置区（已为你填好仓库信息） =================
    const CONFIG = {
      SITE_TITLE: "苏州大学课程资料共享库",
      GITHUB_USER: "Hehe051104",
      GITHUB_REPO: "Resources",
      GITHUB_REPO_URL: "https://github.com/Hehe051104/Resources",
      BRANCH: "main",                      // 默认分支，如果是 master 请修改
      // 第三步配置下载加速后填入，留空则默认走 GitHub Raw 直链
      DOWNLOAD_PROXY_PREFIX: "https://dl.bridges.codes",
      // 第四步配置上传 Worker 后填入
      UPLOAD_WORKER_URL: ""
    };
    // =====================================================================
  </script>

  <!-- 顶部毛玻璃导航栏 -->
  <header class="apple-glass-header sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3 cursor-pointer group" onclick="navigateTo([])">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 text-white flex items-center justify-center text-xl shadow-md shadow-blue-500/20 group-hover:scale-105 transition">
          🎓
        </div>
        <div>
          <h1 id="siteTitle" class="font-semibold text-base sm:text-lg text-slate-900 tracking-tight leading-tight">苏州大学课程资料共享库</h1>
          <p id="statsText" class="text-xs text-slate-500 mt-0.5">正在加载目录索引...</p>
        </div>
      </div>

      <div class="flex items-center gap-2.5 w-full sm:w-auto">
        <div class="relative flex-1 sm:w-60 md:w-68">
          <input id="searchInput" type="text" placeholder="全局搜索课程、PPT、试卷..."
            class="w-full pl-9 pr-8 py-2 text-sm bg-white/65 border border-white/85 focus:bg-white/95 focus:border-blue-400 focus:ring-2 focus:ring-blue-500/15 rounded-full outline-none transition placeholder:text-slate-400 shadow-inner" />
          <span class="absolute left-3 top-2.5 text-slate-400 text-xs">🔍</span>
          <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-2.5 top-2 text-slate-400 hover:text-slate-600 text-sm">✕</button>
        </div>

        <!-- GitHub 点 Star 快捷胶囊按钮 -->
        <a href="https://github.com/Hehe051104/Resources" target="_blank" rel="noopener noreferrer"
          title="前往 GitHub 仓库点个 Star 支持一下"
          class="px-3 py-2 bg-white/80 hover:bg-amber-50/95 border border-white/90 hover:border-amber-200 text-slate-700 hover:text-amber-700 text-xs sm:text-sm font-medium rounded-full shadow-sm transition shrink-0 flex items-center gap-1">
          <span>🌟</span><span class="hidden lg:inline">点个 Star</span>
        </a>

        <!-- 高亮醒目的投稿上传资料按钮 -->
        <button onclick="openUploadNotice()"
          class="px-4 py-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 active:scale-95 text-white text-xs sm:text-sm font-semibold rounded-full shadow-lg shadow-blue-600/30 ring-2 ring-blue-400/30 transition shrink-0 flex items-center gap-1.5 cursor-pointer">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M12 4v12m0-12l-4 4m4-4l4 4" />
          </svg>
          <span>投稿上传资料</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主体内容区 -->
  <main class="max-w-6xl w-full mx-auto px-4 py-5 flex-1">

    <!-- 站点访问数据玻璃看板 -->
    <div class="grid grid-cols-3 gap-2.5 sm:gap-4 mb-4">
      <div class="apple-glass-card px-3.5 sm:px-4 py-3 rounded-2xl flex items-center justify-between">
        <div>
          <div class="text-[11px] sm:text-xs text-slate-500 font-medium">历史总人次 (UV)</div>
          <div id="statTotalUv" class="text-base sm:text-xl font-bold text-slate-800 mt-0.5 tracking-tight">--</div>
        </div>
        <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-slate-500/10 flex items-center justify-center text-base sm:text-lg">👥</div>
      </div>
      <div class="apple-glass-card px-3.5 sm:px-4 py-3 rounded-2xl flex items-center justify-between">
        <div>
          <div class="text-[11px] sm:text-xs text-slate-500 font-medium">历史总访问次数</div>
          <div id="statTotalPv" class="text-base sm:text-xl font-bold text-blue-600 mt-0.5 tracking-tight">--</div>
        </div>
        <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-blue-500/10 flex items-center justify-center text-base sm:text-lg">📈</div>
      </div>
      <div class="apple-glass-card px-3.5 sm:px-4 py-3 rounded-2xl flex items-center justify-between">
        <div>
          <div class="text-[11px] sm:text-xs text-slate-500 font-medium">今日访问次数</div>
          <div id="statTodayPv" class="text-base sm:text-xl font-bold text-emerald-600 mt-0.5 tracking-tight">--</div>
        </div>
        <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-emerald-500/10 flex items-center justify-center text-base sm:text-lg">📅</div>
      </div>
    </div>

    <!-- 工具栏：面包屑导航 + 类型筛选 -->
    <div class="apple-glass p-3 rounded-2xl mb-4 flex flex-wrap items-center justify-between gap-3">
      <!-- 面包屑 -->
      <nav id="breadcrumb" class="flex items-center flex-wrap gap-1 text-sm text-slate-600 px-1"></nav>

      <!-- 格式过滤胶囊组 -->
      <div class="flex items-center gap-1 text-xs overflow-x-auto bg-slate-200/50 p-1 rounded-full" id="filterGroup">
        <button data-filter="all" class="filter-btn px-3 py-1 rounded-full bg-white text-blue-600 font-medium shadow-sm transition">全部</button>
        <button data-filter="ppt" class="filter-btn px-3 py-1 rounded-full hover:bg-white/60 text-slate-600 transition">课件 PPT</button>
        <button data-filter="pdf" class="filter-btn px-3 py-1 rounded-full hover:bg-white/60 text-slate-600 transition">PDF 文档</button>
        <button data-filter="doc" class="filter-btn px-3 py-1 rounded-full hover:bg-white/60 text-slate-600 transition">Word/笔记</button>
        <button data-filter="zip" class="filter-btn px-3 py-1 rounded-full hover:bg-white/60 text-slate-600 transition">压缩包</button>
      </div>
    </div>

    <!-- 批量操作提示栏 -->
    <div id="batchBar" class="hidden apple-glass border-blue-300/60 bg-blue-50/75 text-blue-900 px-4 py-2.5 rounded-2xl mb-4 flex items-center justify-between text-sm">
      <span>已选中 <strong id="selectedCount" class="text-blue-600">0</strong> 个文件</span>
      <div class="flex items-center gap-2">
        <button onclick="clearSelection()" class="px-3 py-1 text-slate-600 hover:text-slate-900 text-xs">取消全选</button>
        <button id="zipDownloadBtn" onclick="downloadSelectedAsZip()" class="px-3.5 py-1 bg-blue-600 hover:bg-blue-700 text-white text-xs rounded-full font-medium shadow-sm transition">
          📦 打包下载 ZIP
        </button>
      </div>
    </div>

    <!-- 文件列表玻璃容器 -->
    <div class="apple-glass rounded-2xl overflow-hidden">
      <!-- 表头 -->
      <div class="grid grid-cols-12 gap-2 px-4 py-3 bg-white/40 border-b border-white/60 text-xs font-medium text-slate-500">
        <div class="col-span-7 sm:col-span-8 flex items-center gap-2.5">
          <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this.checked)" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500/30" />
          <span>名称</span>
        </div>
        <div class="col-span-2 text-right hidden sm:block">大小</div>
        <div class="col-span-5 sm:col-span-2 text-right">操作</div>
      </div>

      <!-- 动态内容列表 -->
      <div id="listContainer" class="divide-y divide-slate-200/45">
        <div class="p-10 text-center text-slate-400 text-sm">正在加载课程目录，请稍候...</div>
      </div>
    </div>
  </main>

  <!-- 底部版权与 GitHub 链接 -->
  <footer class="text-center text-xs text-slate-500 py-6 space-y-1.5">
    <div>
      开源仓库地址：
      <a href="https://github.com/Hehe051104/Resources" target="_blank" rel="noopener noreferrer"
        class="text-blue-600 hover:text-blue-700 font-medium underline decoration-blue-300 underline-offset-2">
        https://github.com/Hehe051104/Resources
      </a>
      （欢迎点 🌟 Star 支持）
    </div>
    <div class="text-slate-400">苏州大学课程资料共享库 · 基于 GitHub + Cloudflare Pages 构建</div>
  </footer>

  <!-- 在线预览毛玻璃弹窗 -->
  <div id="previewModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-6">
    <div class="bg-white/85 backdrop-blur-2xl border border-white/80 rounded-3xl w-full max-w-5xl h-[88vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="px-5 py-3.5 border-b border-slate-200/60 flex items-center justify-between bg-white/50">
        <h3 id="previewTitle" class="font-semibold text-sm text-slate-800 truncate pr-4">文件预览</h3>
        <div class="flex items-center gap-2 shrink-0">
          <a id="previewDownloadBtn" href="#" target="_blank" class="px-3.5 py-1.5 bg-blue-600 text-white text-xs font-medium rounded-full hover:bg-blue-700 shadow-sm transition">下载原文件</a>
          <button onclick="closePreview()" class="w-7 h-7 rounded-full bg-slate-200/70 hover:bg-slate-300/80 text-slate-600 flex items-center justify-center text-sm transition">✕</button>
        </div>
      </div>
      <div id="previewBody" class="flex-1 bg-slate-100/70 overflow-auto flex flex-col items-center justify-center p-2"></div>
    </div>
  </div>

  <script>
    let catalogData = null;
    let currentPath = [];
    let currentFilter = 'all';
    let searchQuery = '';
    let selectedPaths = new Set();

    document.getElementById('siteTitle').textContent = CONFIG.SITE_TITLE;
    document.title = CONFIG.SITE_TITLE;

    function getRawUrl(filePath) {
      const encodedPath = filePath.split('/').map(encodeURIComponent).join('/');
      if (CONFIG.DOWNLOAD_PROXY_PREFIX) {
        const prefix = CONFIG.DOWNLOAD_PROXY_PREFIX.replace(/\/$/, '');
        const fullPrefix = prefix.startsWith('http') ? prefix : `${window.location.origin}${prefix}`;
        return `${fullPrefix}/${encodedPath}`;
      }
      return `https://raw.githubusercontent.com/${CONFIG.GITHUB_USER}/${CONFIG.GITHUB_REPO}/${CONFIG.BRANCH}/${encodedPath}`;
    }

    // 加载访问统计（使用 Abacus 计数接口 + Vercount 备用容错，解决国内超时显示 -- 的问题）
    async function loadVisitorStats() {
      const ns = `suda-${CONFIG.GITHUB_USER}-${CONFIG.GITHUB_REPO}`.toLowerCase().replace(/[^a-z0-9-]/g, '-');
      const apiBase = 'https://abacus.jasoncameron.dev';
      const todayStr = new Date(Date.now() + 8 * 3600 * 1000).toISOString().slice(0, 10);
      const isNewVisitor = !localStorage.getItem('suda_repo_visited_v2');

      try {
        // 1. 历史总访问次数 & 今日访问次数（每次打开页面 +1）
        const [totalPvRes, todayPvRes] = await Promise.all([
          fetch(`${apiBase}/hit/${ns}/total-pv`),
          fetch(`${apiBase}/hit/${ns}/pv-${todayStr}`)
        ]);

        if (totalPvRes.ok) {
          const d = await totalPvRes.json();
          if (typeof d.value === 'number') {
            document.getElementById('statTotalPv').textContent = d.value.toLocaleString();
          }
        }
        if (todayPvRes.ok) {
          const d = await todayPvRes.json();
          if (typeof d.value === 'number') {
            document.getElementById('statTodayPv').textContent = d.value.toLocaleString();
          }
        }

        // 2. 历史总人次 UV（新访客 +1，老访客只读取）
        let uvRes = await fetch(`${apiBase}/${isNewVisitor ? 'hit' : 'get'}/${ns}/total-uv`);
        if (uvRes.status === 404) {
          uvRes = await fetch(`${apiBase}/hit/${ns}/total-uv`);
        }
        if (uvRes.ok) {
          const d = await uvRes.json();
          if (typeof d.value === 'number') {
            document.getElementById('statTotalUv').textContent = d.value.toLocaleString();
            localStorage.setItem('suda_repo_visited_v2', '1');
          }
        }
      } catch (e) {
        // 备用通道：Vercount 统计接口
        try {
          const fallbackRes = await fetch('https://events.vercount.one/api/v2/log', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: window.location.origin + window.location.pathname })
          });
          if (fallbackRes.ok) {
            const fb = await fallbackRes.json();
            if (fb.data) {
              document.getElementById('statTotalUv').textContent = (fb.data.site_uv || 1).toLocaleString();
              document.getElementById('statTotalPv').textContent = (fb.data.site_pv || 1).toLocaleString();
            }
          }
        } catch (err2) {
          console.warn('访问统计接口暂不可用:', err2);
        }
      }
    }

    async function init() {
      loadVisitorStats();
      try {
        const res = await fetch('./catalog.json?t=' + Date.now());
        if (!res.ok) throw new Error('无法读取 catalog.json');
        catalogData = await res.json();
        document.getElementById('statsText').textContent =
          `共收录 ${catalogData.total_files} 份资料 · 更新于 ${catalogData.updated_at.replace(' UTC', '')}`;
        render();
      } catch (err) {
        document.getElementById('listContainer').innerHTML =
          `<div class="p-10 text-center text-red-500 text-sm">目录加载失败：${err.message}<br><span class="text-xs text-slate-400">请确认仓库根目录已生成 catalog.json</span></div>`;
      }
    }

    function getCurrentNode() {
      let node = catalogData.tree;
      for (const segment of currentPath) {
        const next = (node.dirs || []).find(d => d.name === segment);
        if (!next) { currentPath = []; return catalogData.tree; }
        node = next;
      }
      return node;
    }

    function navigateTo(pathArr) {
      currentPath = pathArr;
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      clearSelection();
      render();
    }

    function matchFilter(ext) {
      if (currentFilter === 'all') return true;
      if (currentFilter === 'ppt') return ['ppt', 'pptx'].includes(ext);
      if (currentFilter === 'pdf') return ext === 'pdf';
      if (currentFilter === 'doc') return ['doc', 'docx', 'md', 'txt'].includes(ext);
      if (currentFilter === 'zip') return ['zip', 'rar', '7z', 'tar', 'gz'].includes(ext);
      return true;
    }

    function getFileIcon(ext) {
      if (['ppt', 'pptx'].includes(ext)) return '📊';
      if (ext === 'pdf') return '📕';
      if (['doc', 'docx'].includes(ext)) return '📘';
      if (['xls', 'xlsx', 'csv'].includes(ext)) return '📗';
      if (['zip', 'rar', '7z'].includes(ext)) return '📦';
      if (['png', 'jpg', 'jpeg', 'gif', 'webp'].includes(ext)) return '🖼️';
      if (['py', 'c', 'cpp', 'java', 'js', 'html', 'md'].includes(ext)) return '💻';
      return '📄';
    }

    function canPreview(ext) {
      return ['pdf', 'doc', 'docx', 'png', 'jpg', 'jpeg', 'gif', 'webp', 'md', 'txt'].includes(ext);
    }

    function render() {
      if (!catalogData) return;

      const bc = document.getElementById('breadcrumb');
      let bcHtml = `<button onclick="navigateTo([])" class="hover:text-blue-600 font-medium flex items-center gap-1 transition">🏠 全部资料</button>`;
      currentPath.forEach((seg, idx) => {
        const target = JSON.stringify(currentPath.slice(0, idx + 1)).replace(/"/g, '&quot;');
        bcHtml += `<span class="text-slate-300 mx-0.5">/</span><button onclick="navigateTo(${target})" class="hover:text-blue-600 transition ${idx === currentPath.length - 1 ? 'text-slate-900 font-semibold' : ''}">${seg}</button>`;
      });
      bc.innerHTML = bcHtml;

      const container = document.getElementById('listContainer');
      let dirsToShow = [];
      let filesToShow = [];

      if (searchQuery.trim()) {
        const kw = searchQuery.trim().toLowerCase();
        filesToShow = catalogData.files.filter(f =>
          f.path.toLowerCase().includes(kw) && matchFilter(f.ext)
        );
      } else {
        const node = getCurrentNode();
        dirsToShow = currentFilter === 'all' ? (node.dirs || []) : [];
        filesToShow = (node.files || []).filter(f => matchFilter(f.ext));
      }

      if (dirsToShow.length === 0 && filesToShow.length === 0) {
        container.innerHTML = `<div class="p-12 text-center text-slate-400 text-sm">当前目录下没有符合条件的资料</div>`;
        return;
      }

      let html = '';

      dirsToShow.forEach(dir => {
        const nextPath = JSON.stringify([...currentPath, dir.name]).replace(/"/g, '&quot;');
        html += `
          <div onclick="navigateTo(${nextPath})" class="grid grid-cols-12 gap-2 px-4 py-3 hover:bg-white/65 cursor-pointer transition items-center group">
            <div class="col-span-9 sm:col-span-8 flex items-center gap-2.5 min-w-0">
              <span class="w-4"></span>
              <span class="text-lg group-hover:scale-110 transition">📁</span>
              <span class="font-medium text-sm text-slate-800 truncate group-hover:text-blue-600 transition">${dir.name}</span>
              <span class="text-[11px] px-2 py-0.5 bg-white/80 border border-slate-200/60 text-slate-500 rounded-full shrink-0">${dir.total_files}</span>
            </div>
            <div class="col-span-2 text-right text-xs text-slate-400 hidden sm:block">文件夹</div>
            <div class="col-span-3 sm:col-span-2 text-right text-xs text-blue-600 font-medium opacity-80 group-hover:opacity-100">打开 →</div>
          </div>`;
      });

      filesToShow.forEach(file => {
        const checked = selectedPaths.has(file.path) ? 'checked' : '';
        const url = getRawUrl(file.path);
        const safePath = file.path.replace(/'/g, "\\'");
        const safeName = file.name.replace(/'/g, "\\'");
        const subPathHtml = searchQuery.trim()
          ? `<div class="text-[11px] text-slate-400 truncate mt-0.5">📍 ${file.parts.slice(0, -1).join(' / ') || '根目录'}</div>`
          : '';

        html += `
          <div class="grid grid-cols-12 gap-2 px-4 py-2.5 hover:bg-white/60 transition items-center">
            <div class="col-span-7 sm:col-span-8 flex items-center gap-2.5 min-w-0">
              <input type="checkbox" ${checked} onchange="toggleFileSelect('${safePath}', this.checked)" class="file-checkbox rounded border-slate-300 text-blue-600 shrink-0" data-path="${file.path}" />
              <span class="text-lg shrink-0">${getFileIcon(file.ext)}</span>
              <div class="min-w-0 flex-1">
                <div class="text-sm text-slate-800 truncate" title="${file.name}">${file.name}</div>
                ${subPathHtml}
              </div>
            </div>
            <div class="col-span-2 text-right text-xs text-slate-500 hidden sm:block">${file.size_str}</div>
            <div class="col-span-5 sm:col-span-2 flex items-center justify-end gap-1.5">
              ${canPreview(file.ext) ? `<button onclick="openPreview('${safePath}', '${safeName}', '${file.ext}')" class="px-2.5 py-1 text-xs bg-white/80 hover:bg-white border border-slate-200/70 text-slate-700 rounded-full transition shadow-2xs">预览</button>` : ''}
              <a href="${url}" download="${file.name}" target="_blank" class="px-3 py-1 text-xs bg-blue-500/10 hover:bg-blue-600 text-blue-600 hover:text-white rounded-full font-medium transition">下载</a>
            </div>
          </div>`;
      });

      container.innerHTML = html;
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      document.getElementById('clearSearchBtn').classList.toggle('hidden', !searchQuery);
      render();
    });

    function clearSearch() {
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      render();
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.className = 'filter-btn px-3 py-1 rounded-full hover:bg-white/60 text-slate-600 transition';
        });
        btn.className = 'filter-btn px-3 py-1 rounded-full bg-white text-blue-600 font-medium shadow-sm transition';
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    function toggleFileSelect(path, isChecked) {
      if (isChecked) selectedPaths.add(path);
      else selectedPaths.delete(path);
      updateBatchBar();
    }

    function toggleSelectAll(isChecked) {
      document.querySelectorAll('.file-checkbox').forEach(cb => {
        cb.checked = isChecked;
        if (isChecked) selectedPaths.add(cb.dataset.path);
        else selectedPaths.delete(cb.dataset.path);
      });
      updateBatchBar();
    }

    function clearSelection() {
      selectedPaths.clear();
      const allCb = document.getElementById('selectAllCheckbox');
      if (allCb) allCb.checked = false;
      updateBatchBar();
      render();
    }

    function updateBatchBar() {
      const bar = document.getElementById('batchBar');
      document.getElementById('selectedCount').textContent = selectedPaths.size;
      bar.classList.toggle('hidden', selectedPaths.size === 0);
    }

    async function downloadSelectedAsZip() {
      if (selectedPaths.size === 0) return;
      const btn = document.getElementById('zipDownloadBtn');
      const originText = btn.textContent;
      btn.disabled = true;

      try {
        const zip = new JSZip();
        let done = 0;
        for (const filePath of selectedPaths) {
          btn.textContent = `打包中 (${++done}/${selectedPaths.size})...`;
          const res = await fetch(getRawUrl(filePath));
          if (!res.ok) throw new Error(`下载失败: ${filePath}`);
          const blob = await res.blob();
          zip.file(filePath, blob);
        }
        btn.textContent = '生成压缩包...';
        const content = await zip.generateAsync({ type: 'blob' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = `苏大课程资料打包_${new Date().toISOString().slice(0,10)}.zip`;
        link.click();
      } catch (e) {
        alert('打包过程中出错：' + e.message + '\n（提示：未配置下载加速前，部分地区直连 GitHub 可能会超时）');
      } finally {
        btn.disabled = false;
        btn.textContent = originText;
      }
    }

    async function openPreview(filePath, fileName, ext) {
      const modal = document.getElementById('previewModal');
      const body = document.getElementById('previewBody');
      const dlBtn = document.getElementById('previewDownloadBtn');
      const url = getRawUrl(filePath);

      document.getElementById('previewTitle').textContent = fileName;
      dlBtn.href = url;
      dlBtn.download = fileName;
      body.innerHTML = '<div class="text-sm text-slate-500">正在加载预览内容...</div>';
      modal.classList.remove('hidden');

      if (['png', 'jpg', 'jpeg', 'gif', 'webp'].includes(ext)) {
        body.innerHTML = `<img src="${url}" class="max-h-full max-w-full object-contain rounded-xl shadow" />`;
      } else if (ext === 'pdf') {
        const viewerUrl = `https://mozilla.github.io/pdf.js/web/viewer.html?file=${encodeURIComponent(url)}`;
        body.innerHTML = `<iframe src="${viewerUrl}" class="w-full h-full border-0 rounded-2xl"></iframe>`;
      } else if (['doc', 'docx'].includes(ext)) {
        const officeViewerUrl = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(url)}`;
        body.innerHTML = `
          <div class="w-full text-center text-[11px] text-slate-500 pb-1.5">
            正在通过 Office Online 渲染文档，若文件较大或加载超时，请点击右上角「下载原文件」查看
          </div>
          <iframe src="${officeViewerUrl}" class="w-full flex-1 border-0 rounded-2xl bg-white"></iframe>`;
      } else {
        try {
          const res = await fetch(url);
          const text = await res.text();
          body.innerHTML = `<pre class="w-full h-full bg-white/90 p-5 rounded-2xl text-xs font-mono overflow-auto whitespace-pre-wrap text-slate-800">${text.replace(/</g, '&lt;')}</pre>`;
        } catch (e) {
          body.innerHTML = `<div class="text-sm text-red-500">文本加载失败，请直接点击右上角下载查看。</div>`;
        }
      }
    }

    function closePreview() {
      document.getElementById('previewModal').classList.add('hidden');
      document.getElementById('previewBody').innerHTML = '';
    }

    function openUploadNotice() {
      if (!CONFIG.UPLOAD_WORKER_URL) {
        alert('投稿上传接口将在第四步接入！目前浏览、搜索与下载功能已就绪。');
      }
    }

    init();
  </script>
</body>
</html>
