<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大学课程资料共享库</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <script>
    // ================= 1. 基础配置区（请修改为你的仓库信息） =================
    const CONFIG = {
      SITE_TITLE: "大学课程资料共享库",
      GITHUB_USER: "Hehe051104",      // 例如: "zhangsan"
      GITHUB_REPO: "Resources",          // 例如: "university-courses"
      BRANCH: "main",                      // 默认分支，如果是 master 请修改
      // 第三步配置下载加速后填入，留空则默认走 GitHub Raw 直链
      DOWNLOAD_PROXY_PREFIX: "",
      // 第四步配置上传 Worker 后填入
      UPLOAD_WORKER_URL: ""
    };
    // =========================================================================
  </script>

  <!-- 顶部导航栏 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2 cursor-pointer" onclick="navigateTo([])">
        <span class="text-2xl">📚</span>
        <div>
          <h1 id="siteTitle" class="font-bold text-lg text-slate-900 leading-tight">大学课程资料共享库</h1>
          <p id="statsText" class="text-xs text-slate-500">正在加载目录索引...</p>
        </div>
      </div>

      <div class="flex items-center gap-2 w-full sm:w-auto">
        <div class="relative flex-1 sm:w-72">
          <input id="searchInput" type="text" placeholder="全局搜索课程、PPT、试卷..."
            class="w-full pl-9 pr-8 py-1.5 text-sm bg-slate-100 border border-transparent focus:bg-white focus:border-blue-500 rounded-lg outline-none transition" />
          <span class="absolute left-3 top-2 text-slate-400 text-sm">🔍</span>
          <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-2.5 top-1.5 text-slate-400 hover:text-slate-600 text-sm">✕</button>
        </div>
        <button onclick="openUploadNotice()"
          class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg shadow-sm transition shrink-0 flex items-center gap-1">
          <span>⬆️</span><span>投稿上传</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主体内容区 -->
  <main class="max-w-6xl w-full mx-auto px-4 py-5 flex-1">

    <!-- 工具栏：面包屑导航 + 类型筛选 -->
    <div class="bg-white p-3 rounded-xl border border-slate-200 mb-4 flex flex-wrap items-center justify-between gap-3">
      <!-- 面包屑 -->
      <nav id="breadcrumb" class="flex items-center flex-wrap gap-1 text-sm text-slate-600"></nav>

      <!-- 格式过滤按钮 -->
      <div class="flex items-center gap-1.5 text-xs overflow-x-auto" id="filterGroup">
        <button data-filter="all" class="filter-btn px-2.5 py-1 rounded-md bg-blue-50 text-blue-600 font-medium">全部</button>
        <button data-filter="ppt" class="filter-btn px-2.5 py-1 rounded-md hover:bg-slate-100 text-slate-600">课件 PPT</button>
        <button data-filter="pdf" class="filter-btn px-2.5 py-1 rounded-md hover:bg-slate-100 text-slate-600">PDF 文档</button>
        <button data-filter="doc" class="filter-btn px-2.5 py-1 rounded-md hover:bg-slate-100 text-slate-600">Word/笔记</button>
        <button data-filter="zip" class="filter-btn px-2.5 py-1 rounded-md hover:bg-slate-100 text-slate-600">压缩包</button>
      </div>
    </div>

    <!-- 批量操作提示栏 -->
    <div id="batchBar" class="hidden bg-blue-50 border border-blue-200 text-blue-800 px-4 py-2.5 rounded-xl mb-4 flex items-center justify-between text-sm">
      <span>已选中 <strong id="selectedCount">0</strong> 个文件</span>
      <div class="flex items-center gap-2">
        <button onclick="clearSelection()" class="px-2.5 py-1 text-slate-600 hover:underline">取消全选</button>
        <button id="zipDownloadBtn" onclick="downloadSelectedAsZip()" class="px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium shadow-sm">
          📦 打包下载 ZIP
        </button>
      </div>
    </div>

    <!-- 列表容器 -->
    <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
      <!-- 表头 -->
      <div class="grid grid-cols-12 gap-2 px-4 py-2.5 bg-slate-50 border-b border-slate-200 text-xs font-medium text-slate-500">
        <div class="col-span-7 sm:col-span-8 flex items-center gap-2">
          <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this.checked)" class="rounded border-slate-300" />
          <span>名称</span>
        </div>
        <div class="col-span-2 text-right hidden sm:block">大小</div>
        <div class="col-span-5 sm:col-span-2 text-right">操作</div>
      </div>

      <!-- 动态内容列表 -->
      <div id="listContainer" class="divide-y divide-slate-100">
        <div class="p-10 text-center text-slate-400 text-sm">正在加载课程目录，请稍候...</div>
      </div>
    </div>
  </main>

  <!-- 底部版权 -->
  <footer class="text-center text-xs text-slate-400 py-6">
    基于 GitHub + Cloudflare Pages 构建 · 仅供学习交流使用
  </footer>

  <!-- 在线预览弹窗 -->
  <div id="previewModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-3 sm:p-6">
    <div class="bg-white rounded-2xl w-full max-w-4xl h-[85vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="px-4 py-3 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <h3 id="previewTitle" class="font-medium text-sm text-slate-800 truncate pr-4">文件预览</h3>
        <div class="flex items-center gap-2 shrink-0">
          <a id="previewDownloadBtn" href="#" target="_blank" class="px-3 py-1 bg-blue-600 text-white text-xs rounded-lg hover:bg-blue-700">下载原文件</a>
          <button onclick="closePreview()" class="p-1 text-slate-500 hover:text-slate-800 text-lg leading-none">✕</button>
        </div>
      </div>
      <div id="previewBody" class="flex-1 bg-slate-100 overflow-auto flex items-center justify-center p-2"></div>
    </div>
  </div>

  <script>
    let catalogData = null;
    let currentPath = []; // 当前所在文件夹路径数组，例如 ['机器学习', '课件']
    let currentFilter = 'all';
    let searchQuery = '';
    let selectedPaths = new Set();

    document.getElementById('siteTitle').textContent = CONFIG.SITE_TITLE;
    document.title = CONFIG.SITE_TITLE;

    // 拼接文件下载地址（兼容后续第三步的 Cloudflare 加速反代）
    function getRawUrl(filePath) {
      const encodedPath = filePath.split('/').map(encodeURIComponent).join('/');
      if (CONFIG.DOWNLOAD_PROXY_PREFIX) {
        return `${CONFIG.DOWNLOAD_PROXY_PREFIX.replace(/\/$/, '')}/${encodedPath}`;
      }
      return `https://raw.githubusercontent.com/${CONFIG.GITHUB_USER}/${CONFIG.GITHUB_REPO}/${CONFIG.BRANCH}/${encodedPath}`;
    }

    // 加载 catalog.json
    async function init() {
      try {
        const res = await fetch('./catalog.json?t=' + Date.now());
        if (!res.ok) throw new Error('无法读取 catalog.json');
        catalogData = await res.json();
        document.getElementById('statsText').textContent =
          `共收录 ${catalogData.total_files} 份资料 · 更新于 ${catalogData.updated_at.replace(' UTC', '')}`;
        render();
      } catch (err) {
        document.getElementById('listContainer').innerHTML =
          `<div class="p-10 text-center text-red-500 text-sm">目录加载失败：${err.message}<br><span class="text-xs text-slate-400">请确认仓库根目录已生成 catalog.json</span></div>`;
      }
    }

    // 根据 currentPath 获取当前目录节点
    function getCurrentNode() {
      let node = catalogData.tree;
      for (const segment of currentPath) {
        const next = (node.dirs || []).find(d => d.name === segment);
        if (!next) { currentPath = []; return catalogData.tree; }
        node = next;
      }
      return node;
    }

    function navigateTo(pathArr) {
      currentPath = pathArr;
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      clearSelection();
      render();
    }

    function matchFilter(ext) {
      if (currentFilter === 'all') return true;
      if (currentFilter === 'ppt') return ['ppt', 'pptx'].includes(ext);
      if (currentFilter === 'pdf') return ext === 'pdf';
      if (currentFilter === 'doc') return ['doc', 'docx', 'md', 'txt'].includes(ext);
      if (currentFilter === 'zip') return ['zip', 'rar', '7z', 'tar', 'gz'].includes(ext);
      return true;
    }

    function getFileIcon(ext) {
      if (['ppt', 'pptx'].includes(ext)) return '📊';
      if (ext === 'pdf') return '📕';
      if (['doc', 'docx'].includes(ext)) return '📘';
      if (['xls', 'xlsx', 'csv'].includes(ext)) return '📗';
      if (['zip', 'rar', '7z'].includes(ext)) return '📦';
      if (['png', 'jpg', 'jpeg', 'gif', 'webp'].includes(ext)) return '🖼️';
      if (['py', 'c', 'cpp', 'java', 'js', 'html', 'md'].includes(ext)) return '💻';
      return '📄';
    }

    function canPreview(ext) {
      return ['pdf', 'png', 'jpg', 'jpeg', 'gif', 'webp', 'md', 'txt'].includes(ext);
    }

    // 渲染面包屑与文件列表
    function render() {
      if (!catalogData) return;

      // 1. 渲染面包屑
      const bc = document.getElementById('breadcrumb');
      let bcHtml = `<button onclick="navigateTo([])" class="hover:text-blue-600 font-medium flex items-center gap-1">🏠 全部资料</button>`;
      currentPath.forEach((seg, idx) => {
        const target = JSON.stringify(currentPath.slice(0, idx + 1)).replace(/"/g, '&quot;');
        bcHtml += `<span class="text-slate-300">/</span><button onclick="navigateTo(${target})" class="hover:text-blue-600 ${idx === currentPath.length - 1 ? 'text-slate-900 font-semibold' : ''}">${seg}</button>`;
      });
      bc.innerHTML = bcHtml;

      // 2. 获取要展示的文件夹和文件
      const container = document.getElementById('listContainer');
      let dirsToShow = [];
      let filesToShow = [];

      if (searchQuery.trim()) {
        const kw = searchQuery.trim().toLowerCase();
        filesToShow = catalogData.files.filter(f =>
          f.path.toLowerCase().includes(kw) && matchFilter(f.ext)
        );
      } else {
        const node = getCurrentNode();
        dirsToShow = currentFilter === 'all' ? (node.dirs || []) : [];
        filesToShow = (node.files || []).filter(f => matchFilter(f.ext));
      }

      if (dirsToShow.length === 0 && filesToShow.length === 0) {
        container.innerHTML = `<div class="p-12 text-center text-slate-400 text-sm">当前目录下没有符合条件的资料</div>`;
        return;
      }

      let html = '';

      // 渲染子文件夹
      dirsToShow.forEach(dir => {
        const nextPath = JSON.stringify([...currentPath, dir.name]).replace(/"/g, '&quot;');
        html += `
          <div onclick="navigateTo(${nextPath})" class="grid grid-cols-12 gap-2 px-4 py-3 hover:bg-blue-50/50 cursor-pointer transition items-center">
            <div class="col-span-9 sm:col-span-8 flex items-center gap-2.5 min-w-0">
              <span class="w-4"></span>
              <span class="text-lg">📁</span>
              <span class="font-medium text-sm text-slate-800 truncate">${dir.name}</span>
              <span class="text-xs px-1.5 py-0.5 bg-slate-100 text-slate-500 rounded-full shrink-0">${dir.total_files}</span>
            </div>
            <div class="col-span-2 text-right text-xs text-slate-400 hidden sm:block">文件夹</div>
            <div class="col-span-3 sm:col-span-2 text-right text-xs text-blue-600 font-medium">打开 →</div>
          </div>`;
      });

      // 渲染文件
      filesToShow.forEach(file => {
        const checked = selectedPaths.has(file.path) ? 'checked' : '';
        const url = getRawUrl(file.path);
        const safePath = file.path.replace(/'/g, "\\'");
        const safeName = file.name.replace(/'/g, "\\'");
        const subPathHtml = searchQuery.trim()
          ? `<div class="text-[11px] text-slate-400 truncate mt-0.5">📍 ${file.parts.slice(0, -1).join(' / ') || '根目录'}</div>`
          : '';

        html += `
          <div class="grid grid-cols-12 gap-2 px-4 py-2.5 hover:bg-slate-50 transition items-center">
            <div class="col-span-7 sm:col-span-8 flex items-center gap-2.5 min-w-0">
              <input type="checkbox" ${checked} onchange="toggleFileSelect('${safePath}', this.checked)" class="file-checkbox rounded border-slate-300 shrink-0" data-path="${file.path}" />
              <span class="text-lg shrink-0">${getFileIcon(file.ext)}</span>
              <div class="min-w-0 flex-1">
                <div class="text-sm text-slate-800 truncate" title="${file.name}">${file.name}</div>
                ${subPathHtml}
              </div>
            </div>
            <div class="col-span-2 text-right text-xs text-slate-500 hidden sm:block">${file.size_str}</div>
            <div class="col-span-5 sm:col-span-2 flex items-center justify-end gap-1.5">
              ${canPreview(file.ext) ? `<button onclick="openPreview('${safePath}', '${safeName}', '${file.ext}')" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 rounded transition">预览</button>` : ''}
              <a href="${url}" download="${file.name}" target="_blank" class="px-2.5 py-1 text-xs bg-blue-50 hover:bg-blue-600 text-blue-600 hover:text-white rounded font-medium transition">下载</a>
            </div>
          </div>`;
      });

      container.innerHTML = html;
    }

    // 搜索与筛选事件
    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      document.getElementById('clearSearchBtn').classList.toggle('hidden', !searchQuery);
      render();
    });

    function clearSearch() {
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      render();
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.className = 'filter-btn px-2.5 py-1 rounded-md hover:bg-slate-100 text-slate-600';
        });
        btn.className = 'filter-btn px-2.5 py-1 rounded-md bg-blue-50 text-blue-600 font-medium';
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    // 多选与本地 ZIP 打包
    function toggleFileSelect(path, isChecked) {
      if (isChecked) selectedPaths.add(path);
      else selectedPaths.delete(path);
      updateBatchBar();
    }

    function toggleSelectAll(isChecked) {
      document.querySelectorAll('.file-checkbox').forEach(cb => {
        cb.checked = isChecked;
        if (isChecked) selectedPaths.add(cb.dataset.path);
        else selectedPaths.delete(cb.dataset.path);
      });
      updateBatchBar();
    }

    function clearSelection() {
      selectedPaths.clear();
      const allCb = document.getElementById('selectAllCheckbox');
      if (allCb) allCb.checked = false;
      updateBatchBar();
      render();
    }

    function updateBatchBar() {
      const bar = document.getElementById('batchBar');
      document.getElementById('selectedCount').textContent = selectedPaths.size;
      bar.classList.toggle('hidden', selectedPaths.size === 0);
    }

    async function downloadSelectedAsZip() {
      if (selectedPaths.size === 0) return;
      const btn = document.getElementById('zipDownloadBtn');
      const originText = btn.textContent;
      btn.disabled = true;

      try {
        const zip = new JSZip();
        let done = 0;
        for (const filePath of selectedPaths) {
          btn.textContent = `打包中 (${++done}/${selectedPaths.size})...`;
          const res = await fetch(getRawUrl(filePath));
          if (!res.ok) throw new Error(`下载失败: ${filePath}`);
          const blob = await res.blob();
          zip.file(filePath, blob);
        }
        btn.textContent = '生成压缩包...';
        const content = await zip.generateAsync({ type: 'blob' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = `课程资料打包_${new Date().toISOString().slice(0,10)}.zip`;
        link.click();
      } catch (e) {
        alert('打包过程中出错：' + e.message + '\n（提示：未配置下载加速前，部分地区直连 GitHub 可能会超时）');
      } finally {
        btn.disabled = false;
        btn.textContent = originText;
      }
    }

    // 在线预览逻辑
    async function openPreview(filePath, fileName, ext) {
      const modal = document.getElementById('previewModal');
      const body = document.getElementById('previewBody');
      const dlBtn = document.getElementById('previewDownloadBtn');
      const url = getRawUrl(filePath);

      document.getElementById('previewTitle').textContent = fileName;
      dlBtn.href = url;
      dlBtn.download = fileName;
      body.innerHTML = '<div class="text-sm text-slate-500">正在加载预览内容...</div>';
      modal.classList.remove('hidden');

      if (['png', 'jpg', 'jpeg', 'gif', 'webp'].includes(ext)) {
        body.innerHTML = `<img src="${url}" class="max-h-full max-w-full object-contain rounded shadow" />`;
      } else if (ext === 'pdf') {
        // 使用 Mozilla PDF.js 公共预览器或 iframe，解决 raw.githubusercontent.com 强制下载头导致无法内嵌的问题
        const viewerUrl = `https://mozilla.github.io/pdf.js/web/viewer.html?file=${encodeURIComponent(url)}`;
        body.innerHTML = `<iframe src="${viewerUrl}" class="w-full h-full border-0 rounded"></iframe>`;
      } else {
        try {
          const res = await fetch(url);
          const text = await res.text();
          body.innerHTML = `<pre class="w-full h-full bg-white p-4 rounded text-xs font-mono overflow-auto whitespace-pre-wrap text-slate-800">${text.replace(/</g, '&lt;')}</pre>`;
        } catch (e) {
          body.innerHTML = `<div class="text-sm text-red-500">文本加载失败，请直接点击右上角下载查看。</div>`;
        }
      }
    }

    function closePreview() {
      document.getElementById('previewModal').classList.add('hidden');
      document.getElementById('previewBody').innerHTML = '';
    }

    function openUploadNotice() {
      if (!CONFIG.UPLOAD_WORKER_URL) {
        alert('投稿上传接口将在第四步接入！目前浏览、搜索与下载功能已就绪。');
      }
    }

    init();
  </script>
</body>
</html>
